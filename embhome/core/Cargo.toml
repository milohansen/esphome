[package]
name = "esphome-core"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-sync = { workspace = true }
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
heapless = { workspace = true }
serde = { workspace = true }

# Core doesn't directly depend on esp-hal, but it defines chip features
# that get propagated to components that do depend on esp-hal
# This ensures all crates in the workspace use consistent chip selection

[features]
# Chip features - exactly one must be enabled at build time
# These features are forwarded from the root/generated project to ensure
# all dependencies use the same chip configuration
esp32 = []
esp32c3 = []
esp32s2 = []
esp32s3 = []
esp32c2 = []
esp32c5 = []
esp32c6 = []
esp32h2 = []
esp32p4 = []

# Default feature for development/testing (should be overridden in real builds)
default = []
