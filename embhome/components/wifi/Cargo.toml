[package]
name = "esphome-wifi"
version = "0.1.0"
edition = "2024"

[dependencies]
esphome-core = { path = "../../core" }
esphome-config = { path = "../../config" }
esp-wifi = { version = "0.11.0", default-features = false }
embassy-net = { version = "0.6.0", features = ["tcp", "udp", "dhcpv4", "medium-ethernet", "proto-ipv4", "dns"] }
embassy-executor = { version = "0.9.1", features = ["executor-thread"] }
embassy-time = { version = "0.5.0", features = ["generic-queue-8"] }
esp-hal = { version = "1.0.0", features = ["unstable"] }
log = "0.4"
smoltcp = { version = "0.12.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-icmp", "socket-udp", "socket-tcp"] }
esp-alloc = "0.5.0"
embassy-sync = "0.7.2"
embassy-futures = "0.1.1"
embedded-hal = "1.0"
embedded-hal-async = "1.0"

[features]
esp32 = ["esp-wifi/esp32", "esp-hal/esp32"]
esp32c3 = ["esp-wifi/esp32c3", "esp-hal/esp32c3"]
esp32s2 = ["esp-wifi/esp32s2", "esp-hal/esp32s2"]
esp32s3 = ["esp-wifi/esp32s3", "esp-hal/esp32s3"]
