[package]
name = "esphome-uptime"
version = "0.1.0"
edition = "2024"

[dependencies]
esphome-core = { workspace = true }
esphome-sensor = { workspace = true }
embassy-time = { workspace = true }
embassy-executor = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }

[features]
# Forward chip features through the dependency chain
esp32 = ["esphome-core/esp32", "esphome-sensor/esp32"]
esp32c3 = ["esphome-core/esp32c3", "esphome-sensor/esp32c3"]
esp32s2 = ["esphome-core/esp32s2", "esphome-sensor/esp32s2"]
esp32s3 = ["esphome-core/esp32s3", "esphome-sensor/esp32s3"]
esp32c2 = ["esphome-core/esp32c2", "esphome-sensor/esp32c2"]
esp32c5 = ["esphome-core/esp32c5", "esphome-sensor/esp32c5"]
esp32c6 = ["esphome-core/esp32c6", "esphome-sensor/esp32c6"]
esp32h2 = ["esphome-core/esp32h2", "esphome-sensor/esp32h2"]
esp32p4 = ["esphome-core/esp32p4", "esphome-sensor/esp32p4"]

default = []
