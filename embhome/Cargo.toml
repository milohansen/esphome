[package]
name = "embhome"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.9.1", features = ["arch-riscv32"] }
embassy-time = { version = "0.5.0", features = ["generic-queue-8"] }
embassy-sync = "0.7.2"
embassy-futures = "0.1.2"
esp-hal = { version = "1.0.0", features = ["esp32c3"] }
esp-backtrace = { version = "0.18.1", features = ["esp32c3", "panic-handler", "println"] }
esp-println = { version = "0.16.1", features = ["esp32c3"] }
log = "0.4.29"
static_cell = "2.1.1"
hashbrown = { version = "0.16.1", features = ["inline-more"] }
critical-section = "1.2.0"
vcell = "0.1.3"

[build-dependencies]
bindgen = "0.72.1"
embuild = "0.33.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
