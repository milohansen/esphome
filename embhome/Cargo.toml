[package]
name = "embhome"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-executor = { version = "0.6.3", features = ["task-arena-size-12288"] }
embassy-time = { version = "0.3.2", features = ["generic-queue-8"] }
embassy-sync = "0.6.1"
embassy-futures = "0.1.1"
esp-hal = { version = "0.23.1", features = ["esp32c3", "embassy"] }
esp-backtrace = { version = "0.15.0", features = ["esp32c3", "panic-handler", "exception-handler", "println"] }
esp-println = { version = "0.13.0", features = ["esp32c3", "log"] }
log = "0.4.22"
static_cell = "2.1.0"
hashbrown = { version = "0.15.2", features = ["ahash", "inline-more"] }
critical-section = "1.2.0"
vcell = "0.1.3"

[build-dependencies]
bindgen = "0.71.1"
embuild = "0.33.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
