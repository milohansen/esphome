[workspace]
resolver = "2"
members = [
    "core",
    "hal",
    "config",
    "components/gpio",
    "components/wifi",
    "components/api",
    "components/ota",
    "components/sensor",
    "components/uptime",
]

# Workspace-level dependency management ensures only one version of each dependency
# is used across all crates. This is critical for embedded systems to avoid:
# 1. Multiple copies of the same library (wastes flash)
# 2. Type incompatibility issues
# 3. Undefined behavior from multiple instances of globals

[workspace.dependencies]
# Internal workspace crates
esphome-core = { path = "core" }
esphome-hal = { path = "hal" }
esphome-config = { path = "config" }
esphome-wifi = { path = "components/wifi" }
esphome-sensor = { path = "components/sensor" }

# Embassy ecosystem - async runtime for embedded systems
# Note: All embassy crates MUST use the same version to avoid type incompatibility
embassy-executor = { version = "0.9.1", features = ["executor-thread"] }
embassy-time = { version = "0.5.0", features = ["generic-queue-8"] }
embassy-sync = "0.7.2"
embassy-net = { version = "0.6.0", features = ["tcp", "udp", "dhcpv4", "medium-ethernet", "proto-ipv4", "dns"] }
embassy-futures = "0.1.1"

# ESP HAL - Hardware Abstraction Layer
# Version 1.0.0 is the latest stable release
# Features are set at build time via --features flag based on target chip
esp-hal = { version = "1.0.0", features = ["unstable"] }
esp-wifi = { version = "0.11.0", default-features = false }
esp-storage = "0.3.0"
esp-alloc = "0.5.0"
esp-backtrace = { version = "0.11", features = ["panic-handler", "exception-handler"] }
esp-println = "0.9"

# Embedded HAL traits
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-storage = "0.3"

# Networking
smoltcp = { version = "0.12.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-icmp", "socket-udp", "socket-tcp"] }

# Serialization and data structures
heapless = "0.8"
serde = { version = "1.0", default-features = false }
prost = { version = "0.13.0", default-features = false, features = ["alloc"] }

# Utilities
log = "0.4"
async-trait = "0.1"
byteorder = { version = "1.4", default-features = false }
crc = "3.0"
md-5 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false }

# Build dependencies (used in build.rs)
[workspace.dependencies.prost-build]
version = "0.13.0"

# Chip-specific features that need to propagate to all relevant crates
# These are set via command-line: cargo build --features esp32c3
# Or in a generated project's Cargo.toml
[workspace.metadata.chip-features]
# Available chip targets - exactly one must be selected at build time
chips = ["esp32", "esp32c3", "esp32s2", "esp32s3", "esp32c2", "esp32c5", "esp32c6", "esp32h2", "esp32p4"]

# Mapping of chip features to dependencies that need them
# When a chip feature is enabled, it should be propagated to these crates:
esp32 = ["esp-hal/esp32", "esp-wifi/esp32"]
esp32c3 = ["esp-hal/esp32c3", "esp-wifi/esp32c3"]
esp32s2 = ["esp-hal/esp32s2", "esp-wifi/esp32s2"]
esp32s3 = ["esp-hal/esp32s3", "esp-wifi/esp32s3"]
esp32c2 = ["esp-hal/esp32c2", "esp-wifi/esp32c2"]
esp32c5 = ["esp-hal/esp32c5"]
esp32c6 = ["esp-hal/esp32c6", "esp-wifi/esp32c6"]
esp32h2 = ["esp-hal/esp32h2", "esp-wifi/esp32h2"]
esp32p4 = ["esp-hal/esp32p4"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
