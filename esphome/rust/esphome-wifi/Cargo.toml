[package]
name = "esphome-wifi"
version = "0.1.0"
edition = "2021"

[dependencies]
esphome-core = { path = "../esphome-core" }
esphome-config = { path = "../esphome-config" }
esp-wifi = { version = "0.11.0", default-features = false, features = ["embassy-net"] }
embassy-net = { version = "0.6.0", features = ["tcp", "udp", "dhcpv4", "medium-ethernet", "proto-ipv4", "dns"] }
embassy-executor = "0.6.0"
embassy-time = "0.3.2"
esp-hal = "0.22.0"
log = "0.4"
smoltcp = { version = "0.12.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-icmp", "socket-udp", "socket-tcp"] }
esp-alloc = "0.5.0"

[features]
esp32 = ["esp-wifi/esp32"]
esp32c3 = ["esp-wifi/esp32c3"]
esp32s2 = ["esp-wifi/esp32s2"]
esp32s3 = ["esp-wifi/esp32s3"]
