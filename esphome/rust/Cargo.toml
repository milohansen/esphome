[workspace]
resolver = "2"
members = [
    "esphome-core",
    "esphome-hal",
    "esphome-config",
    "esphome-gpio",
    "esphome-wifi",
    "esphome-api",
    "esphome-sensor",
    "esphome-uptime",
    "esphome-ota",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
