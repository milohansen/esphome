[package]
name = "esphome-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-executor = { version = "0.7.0", features = ["executor-thread", "task-arena-size-12288"] }
embassy-time = { version = "0.5.0", features = ["generic-queue-8"] }
embassy-sync = "0.6.2"
embassy-futures = "0.1.1"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
esp-hal = { version = "1.0.0", features = ["esp32"] }
esp-hal-embassy = { version = "0.9.1", features = ["esp32", "executors"] }
esp-backtrace = { version = "0.15.1", features = ["panic-handler", "exception-handler", "println"] }
esp-println = { version = "0.13.1", features = ["esp32", "log"] }
log = "0.4"
static_cell = "2.0"
critical-section = "1.1"

[build-dependencies]
bindgen = "0.69"
cc = "1.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
